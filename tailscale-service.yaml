# Exposes LDR's web UI on your tailnet.
# Reachable at http://local-deep-research-tailscale
apiVersion: v1
kind: Service
metadata:
  name: local-deep-research-tailscale
  annotations:
    tailscale.com/expose: "true"
spec:
  selector:
    app.kubernetes.io/name: local-deep-research
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  type: ClusterIP