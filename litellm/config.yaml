model_list:
  - model_name: deepseek-v4-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028

  - model_name: claude-sonnet-4
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4-20250514
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

  - model_name: claude-sonnet-4-thinking
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4-20250514
      api_key: os.environ/OPENROUTER_API_KEY
      extra_headers:
        X-Title: litellm-gateway
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

  - model_name: gpt-4o
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001

  - model_name: qwen-32b
    litellm_params:
      model: openrouter/qwen/qwen-3-32b
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000008
      output_cost_per_token: 0.00000028

  - model_name: gemini-flash
    litellm_params:
      model: openrouter/google/gemini-2.5-flash-preview-04-17
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000025

general_settings: {}

litellm_settings:
  # Silently drop provider-unsupported params (e.g. 'thinking' sent by OpenClaw
  # to deepseek-v4-flash on OpenRouter, which returns 400 UnsupportedParamsError
  # otherwise). Models that DO support those params still receive them.
  drop_params: true
