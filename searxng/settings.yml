server:
  secret_key: "changeme-in-production-k8s-secret"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  method: GET

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

ui:
  static_use_hash: true
  default_locale: ""
  theme: simple
  login:
    disabled: true

outgoing:
  request_timeout: 10.0
  max_request_timeout: 30.0
  useragent_suffix: ""

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: arxiv
    engine: arxiv
    shortcut: ar
    disabled: false

  - name: pubmed
    engine: pubmed
    shortcut: pm
    disabled: false

  - name: semascholar
    engine: semascholar
    shortcut: ss
    disabled: false

  - name: news
    engine: google_news
    shortcut: gn
    disabled: false
