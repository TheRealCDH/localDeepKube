apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/component: search-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      enableServiceLinks: false
      initContainers:
        - name: init-config
          image: busybox
          command:
            - sh
            - -c
            - cp /tmp/config/settings.yml /etc/searxng/settings.yml && chown 1000:1000 /etc/searxng/settings.yml
          volumeMounts:
            - name: config-tmp
              mountPath: /tmp/config
              readOnly: true
            - name: config-dir
              mountPath: /etc/searxng
      containers:
        - name: searxng
          image: searxng/searxng:latest
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config-dir
              mountPath: /etc/searxng
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            failureThreshold: 5
      volumes:
        - name: config-tmp
          configMap:
            name: searxng-config
        - name: config-dir
          emptyDir: {}
