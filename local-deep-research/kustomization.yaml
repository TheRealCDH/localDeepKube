apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml

configMapGenerator:
  - name: ldr-env
    literals:
      - LDR_LLM_PROVIDER=openai_endpoint
      - LDR_LLM_OPENAI_ENDPOINT_URL=http://litellm:4000/v1
      - LDR_LLM_OPENAI_ENDPOINT_API_KEY=not-needed
      - LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_INSTANCE_URL=http://searxng:8080
      - LDR_APP_ALLOW_REGISTRATIONS=true
      - LDR_DATA_DIR=/data
      - LDR_WEB_HOST=0.0.0.0
      - LDR_WEB_PORT=5000

labels:
  - pairs:
      app.kubernetes.io/part-of: localdeepkube