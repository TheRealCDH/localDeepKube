apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-deep-research
  labels:
    app.kubernetes.io/name: local-deep-research
    app.kubernetes.io/component: research-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: local-deep-research
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-deep-research
    spec:
      containers:
        - name: local-deep-research
          image: localdeepresearch/local-deep-research:latest
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: ldr-env
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /auth/login
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            periodSeconds: 15
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ldr-data